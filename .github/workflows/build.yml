name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build-check only: no secrets. Releases are signed and notarized locally (scripts/release.sh).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: swift --version

      - name: Build the universal app (ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Self-tests
        run: build/Quotacat.app/Contents/MacOS/Quotacat --selftest

      - name: Still runs on macOS 14
        run: |
          for arch in arm64 x86_64; do
            vtool -arch "$arch" -show-build build/Quotacat.app/Contents/MacOS/Quotacat | grep -q "minos 14.0" \
              || { echo "::error::$arch slice requires a newer macOS than 14.0"; exit 1; }
          done
