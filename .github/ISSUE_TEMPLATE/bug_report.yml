name: Bug report
description: Something in Quotacat is wrong, broken, or shows the wrong numbers.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Questions and ideas are welcome in [Discussions](https://github.com/mrte1122/Quotacat/discussions) instead.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popover
        2. Switch to the Actions tab
        3. ...

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options:
        - Sign in / credentials
        - API rate limits
        - Actions minutes or budget
        - Copilot AI Credits
        - Pull requests tab
        - Actions tab (failing workflows)
        - Menu-bar icon
        - Notifications
        - Updates
        - Settings
        - Something else
    validations:
      required: true

  - type: input
    id: quotacat-version
    attributes:
      label: Quotacat version
      description: Settings → General → About
      placeholder: "1.7.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version and chip
      placeholder: "macOS 26.1, Apple silicon"
    validations:
      required: true

  - type: dropdown
    id: sign-in
    attributes:
      label: How is Quotacat signed in?
      options:
        - Sign in with GitHub
        - GitHub CLI (gh)
        - Personal access token
        - Not signed in
    validations:
      required: true

  - type: textarea
    id: once-output
    attributes:
      label: Output of `--once` (optional, very helpful for wrong numbers)
      description: |
        Run in Terminal and paste the result. It never prints your token, but review it before posting:
        `/Applications/Quotacat.app/Contents/MacOS/Quotacat --once`
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I've removed anything I don't want public (private repository names, billing amounts).
          required: true
